<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="globe" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a0a35"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="rgba(100,150,255,0)"/>
      <stop offset="100%" stop-color="rgba(120,180,255,0.55)"/>
    </radialGradient>
  </defs>

  <!-- Atmosphere glow -->
  <circle cx="32" cy="32" r="30" fill="url(#atmo)"/>

  <!-- Globe sphere -->
  <circle cx="32" cy="32" r="26" fill="url(#globe)" stroke="#ffd700" stroke-width="1.2"/>

  <!-- Latitude lines -->
  <g fill="none" stroke="rgba(255,215,0,0.5)" stroke-width="0.8">
    <ellipse cx="32" cy="32" rx="26" ry="8"/>
    <ellipse cx="32" cy="32" rx="26" ry="18"/>
  </g>

  <!-- Longitude lines -->
  <g fill="none" stroke="rgba(255,215,0,0.5)" stroke-width="0.8">
    <ellipse cx="32" cy="32" rx="8" ry="26"/>
    <ellipse cx="32" cy="32" rx="18" ry="26"/>
    <line x1="32" y1="6" x2="32" y2="58"/>
  </g>

  <!-- Event dots -->
  <circle cx="22" cy="22" r="2.4" fill="#FF6347"/>
  <circle cx="42" cy="26" r="2.4" fill="#DAA520"/>
  <circle cx="36" cy="42" r="2.4" fill="#00CED1"/>
  <circle cx="24" cy="40" r="2.2" fill="#FF1493"/>
</svg>
