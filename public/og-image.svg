<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="60%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#000010"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a0a35"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="rgba(100,150,255,0)"/>
      <stop offset="100%" stop-color="rgba(100,150,255,0.5)"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="250" cy="150" r="1"/>
    <circle cx="400" cy="60" r="2"/>
    <circle cx="550" cy="120" r="1"/>
    <circle cx="700" cy="40" r="1.5"/>
    <circle cx="850" cy="100" r="1"/>
    <circle cx="1000" cy="80" r="2"/>
    <circle cx="1150" cy="160" r="1"/>
    <circle cx="80" cy="300" r="1"/>
    <circle cx="180" cy="450" r="1.5"/>
    <circle cx="120" cy="540" r="1"/>
    <circle cx="1100" cy="350" r="1.5"/>
    <circle cx="1050" cy="500" r="1"/>
    <circle cx="1150" cy="580" r="2"/>
    <circle cx="950" cy="550" r="1"/>
    <circle cx="50" cy="200" r="1"/>
  </g>

  <!-- Atmosphere glow around globe -->
  <circle cx="350" cy="315" r="280" fill="url(#atmo)"/>

  <!-- Globe -->
  <circle cx="350" cy="315" r="240" fill="url(#globe)" stroke="rgba(100,150,255,0.3)" stroke-width="1"/>

  <!-- Latitude lines -->
  <g fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <ellipse cx="350" cy="315" rx="240" ry="60"/>
    <ellipse cx="350" cy="315" rx="240" ry="120"/>
    <ellipse cx="350" cy="315" rx="240" ry="180"/>
    <ellipse cx="350" cy="315" rx="240" ry="220"/>
  </g>

  <!-- Longitude lines -->
  <g fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <ellipse cx="350" cy="315" rx="60" ry="240"/>
    <ellipse cx="350" cy="315" rx="120" ry="240"/>
    <ellipse cx="350" cy="315" rx="180" ry="240"/>
    <ellipse cx="350" cy="315" rx="220" ry="240"/>
  </g>

  <!-- Event dots on globe -->
  <g filter="url(#glow)">
    <circle cx="280" cy="220" r="6" fill="#FF6347"/>
    <circle cx="380" cy="180" r="6" fill="#DAA520"/>
    <circle cx="450" cy="280" r="6" fill="#00CED1"/>
    <circle cx="320" cy="350" r="6" fill="#9370DB"/>
    <circle cx="240" cy="390" r="6" fill="#1E90FF"/>
    <circle cx="420" cy="420" r="6" fill="#FF1493"/>
    <circle cx="200" cy="290" r="6" fill="#DC143C"/>
    <circle cx="370" cy="450" r="6" fill="#32CD32"/>
    <circle cx="490" cy="350" r="6" fill="#FFD700"/>
  </g>

  <!-- Text content -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="650" y="200" font-size="56" font-weight="800" fill="#ffffff">
      Simulasi Sejarah
    </text>
    <text x="650" y="270" font-size="56" font-weight="800" fill="#FFD700">
      Dunia 3D
    </text>

    <text x="650" y="330" font-size="22" fill="#cccccc">
      Globe interaktif peristiwa sejarah
    </text>
    <text x="650" y="362" font-size="22" fill="#cccccc">
      dari 3000 SM hingga 2025 M.
    </text>

    <!-- Tags -->
    <g font-size="16" font-weight="600">
      <rect x="650" y="410" width="120" height="34" rx="17" fill="rgba(255,99,71,0.2)" stroke="#FF6347"/>
      <text x="710" y="432" text-anchor="middle" fill="#FF6347">Nusantara</text>

      <rect x="780" y="410" width="160" height="34" rx="17" fill="rgba(218,165,32,0.2)" stroke="#DAA520"/>
      <text x="860" y="432" text-anchor="middle" fill="#DAA520">Peradaban Kuno</text>

      <rect x="950" y="410" width="140" height="34" rx="17" fill="rgba(0,206,209,0.2)" stroke="#00CED1"/>
      <text x="1020" y="432" text-anchor="middle" fill="#00CED1">Perdagangan</text>

      <rect x="650" y="454" width="140" height="34" rx="17" fill="rgba(147,112,219,0.2)" stroke="#9370DB"/>
      <text x="720" y="476" text-anchor="middle" fill="#9370DB">Penjelajahan</text>

      <rect x="800" y="454" width="100" height="34" rx="17" fill="rgba(220,20,60,0.2)" stroke="#DC143C"/>
      <text x="850" y="476" text-anchor="middle" fill="#DC143C">Perang</text>

      <rect x="910" y="454" width="80" height="34" rx="17" fill="rgba(192,192,192,0.2)" stroke="#C0C0C0"/>
      <text x="950" y="476" text-anchor="middle" fill="#C0C0C0">Sains</text>
    </g>

    <!-- Footer line -->
    <text x="650" y="555" font-size="18" fill="#888888">
      🌍 Timeline · 🛤️ Rute Perdagangan · 🔊 Narasi Bahasa Indonesia
    </text>
  </g>
</svg>
